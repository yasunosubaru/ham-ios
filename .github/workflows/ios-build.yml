name: iOS Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: '0'
  # macos-15 ships several Xcode versions and changes which one is selected by
  # default whenever the image is updated, so an unpinned build stops
  # reproducing without any change to this repository. 16.4 is what the image
  # defaults to today and sits above the Xcode 16.1 floor that React Native 0.87
  # requires. Bump this together with a deliberate toolchain change.
  XCODE_VERSION: '16.4'

jobs:
  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          set -euo pipefail
          developer_dir="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          if [ ! -d "$developer_dir" ]; then
            echo "::error::Xcode ${XCODE_VERSION} is not on this runner image. Bump XCODE_VERSION in this workflow." >&2
            ls -1 /Applications | grep -i xcode >&2 || true
            exit 1
          fi
          sudo xcode-select -s "$developer_dir"
      - name: Record Xcode version
        id: xcode
        run: |
          set -euo pipefail
          # Read the whole output before slicing it. Piping xcodebuild straight
          # into `head` closes the pipe after the first line, and current Xcode
          # releases then abort with an uncaught NSFileHandle broken-pipe
          # exception, which `set -o pipefail` turns into a failed step.
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          version="${xcode_version%%$'\n'*}"
          test -n "$version"
          echo "version=${version// /-}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install CocoaPods
        run: gem install cocoapods -v 1.16.2 --no-document
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          # The Pods tree depends on the resolved react-native version, not just
          # on Podfile.lock: bumping react-native swaps the hermes-engine podspec
          # without changing Podfile.lock, so a cache keyed only on Podfile.lock
          # restores Pods/Local Podspecs for the previous RN version and
          # `pod install` then fails with
          # "CocoaPods could not find compatible versions for pod hermes-engine".
          #
          # Deliberately no `restore-keys` fallback: a prefix match would restore
          # a Pods tree built against a different react-native version, which is
          # exactly the failure this key is meant to avoid. A miss just rebuilds
          # Pods from scratch.
          key: ${{ runner.os }}-ios-${{ steps.xcode.outputs.version }}-pods-1.16.2-${{ hashFiles('ios/Podfile.lock', 'node_modules/react-native/sdks/hermes-engine/version.properties', 'node_modules/react-native/package.json') }}
      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod _1.16.2_ install --no-repo-update
      - name: Embed scripts
        run: pnpm embed
      - name: Build iOS Debug
        working-directory: ios
        run: |
          xcodebuild \
            -workspace ham-rn.xcworkspace \
            -scheme ham-rn \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            build \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO
      - name: Build iOS Release (unsigned)
        working-directory: ios
        run: |
          xcodebuild \
            -workspace ham-rn.xcworkspace \
            -scheme ham-rn \
            -sdk iphonesimulator \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            build \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      # Everything above builds against iphonesimulator, but TestFlight packages
      # the device SDK. A simulator-only build never compiles the arm64 slices
      # and never exercises the device-only parts of the configuration, so add
      # one unsigned device build. CODE_SIGNING_ALLOWED=NO keeps it a pure
      # compile check: nothing is signed, archived for upload, or distributed.
      - name: Build iOS Release for device (unsigned)
        working-directory: ios
        run: |
          xcodebuild \
            -workspace ham-rn.xcworkspace \
            -scheme ham-rn \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
