name: Release

on:
  push:
    tags:
      - 'v*'

env:
  HUSKY: '0'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle
        run: |
          pnpm bundle:android
          pnpm bundle:ios

      # Named `*-jsbundle-1.0.0.zip` rather than `*-bundle.zip`, because a
      # release that also carries a runnable Ham.app otherwise has two very
      # different things both called "bundle" and a reader cannot tell which one
      # installs. The JS bundle is a source drop, not an app.
      - name: Zip bundles
        run: |
          cd build/android && zip -r ../../ham-android-jsbundle-1.0.0.zip . && cd ../..
          cd build/ios && zip -r ../../ham-ios-jsbundle-1.0.0.zip . && cd ../..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ham-android-jsbundle-1.0.0.zip
            ham-ios-jsbundle-1.0.0.zip
